name: CI - Commit

on:
  push:
    branches:
      - '**'

jobs:

  lint:
    name: Verificação de estilo (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Testes e cobertura (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: alphynha/forum-anonimo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Publicar imagem no DockerHub
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            alphynha/forum-anonimo:latest
            alphynha/forum-anonimo:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max